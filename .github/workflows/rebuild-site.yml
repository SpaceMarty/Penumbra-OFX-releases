name: Rebuild the website

# penumbra.tools shows each release's version and notes, read from this repository's published
# releases when the site builds. A release arrives here as a draft and goes public only when the
# operator publishes it, so that is the moment the site must rebuild.
#
# Secret: SITE_DEPLOY_HOOK, the penumbra-web Worker's Cloudflare deploy hook URL (branch main).
# The URL is the credential. Missing or failing, this warns and the release stands; the site
# catches up at its next deploy.

on:
  release:
    types: [published]

permissions: {}

jobs:
  rebuild:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Call the website's deploy hook
        env:
          SITE_DEPLOY_HOOK: ${{ secrets.SITE_DEPLOY_HOOK }}
        run: |
          if [[ -z "$SITE_DEPLOY_HOOK" ]]; then
            echo "::warning::SITE_DEPLOY_HOOK is not set; penumbra.tools shows this release at its next deploy"
            exit 0
          fi
          if curl -fsS --retry 3 --max-time 30 -X POST "$SITE_DEPLOY_HOOK" -o /dev/null; then
            echo "Website rebuild requested."
          else
            echo "::warning::the website's deploy hook failed; penumbra.tools shows this release at its next deploy"
          fi
